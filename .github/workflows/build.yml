name: Build Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '原生版本号，auto 读取目标提交的 VERSION'
        type: string
        default: 'auto'
      commit_sha:
        description: '待发布的提交、分支或标签；留空使用事件提交'
        type: string
        default: ''
      release_type:
        description: '发布类型'
        type: choice
        default: '最新正式版（latest release）'
        options:
          - '最新正式版（latest release）'
          - '预发布版（pre-release）'

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      commit_sha: ${{ inputs.commit_sha }}
      release_type: ${{ inputs.release_type }}
      build_package: true
      build_image: false
