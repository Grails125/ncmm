name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '原生版本号，auto 读取目标提交的 VERSION'
        type: string
        default: 'auto'
      commit_sha:
        description: '待发布的提交、分支或标签；留空使用事件提交'
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      commit_sha: ${{ inputs.commit_sha }}
      release_type: 最新正式版（latest release）
      build_image: true
      build_package: false
