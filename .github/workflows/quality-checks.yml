name: Quality Checks

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
  workflow_call:
    inputs:
      commit_sha:
        description: '已经解析的待发布提交 SHA；质量检查和构建必须使用同一提交'
        required: true
        type: string

permissions:
  contents: read

env:
  NCMM_TEST_LIVE: ''
  NCMM_UPDATER_CHECK: 'false'
  NCMM_UPDATER_AUTO_UPDATE: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Verify requested source commit
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$EXPECTED_COMMIT" ]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check WebUI JavaScript syntax
        run: node --check internal/webui/static/app.js

      - name: Test browser launcher, account status and task configuration
        run: node --test tests/run_webui_browser.test.js tests/webui_cookie_status.test.js tests/webui_music_partner_config.test.js tests/webui_music_partner_points.test.js tests/webui_task_config.test.js tests/webui_update_restart.test.js tests/webui_upgrade_policy.test.js tests/webui_base_fixes.test.js tests/webui_plugin_platform.test.js

      - name: Test login, updater and release scripts
        run: |
          python3 -m unittest discover -s tests -p test_ncmm_login_script.py
          python3 -m unittest discover -s tests -p test_ncmm_update_script.py
          python3 -m unittest discover -s tests -p test_release_guard.py

      - name: Install WebUI browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build WebUI test executable
        run: go build -ldflags "-X main.Version=$(cat VERSION)" -o "$RUNNER_TEMP/ncmm" .

      - name: Test WebUI in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_smoke.js "$RUNNER_TEMP/webui-smoke"

      - name: Test native scoring UI in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_music_partner.js "$RUNNER_TEMP/webui-music-partner"

      - name: Test verified login status in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_cookie_status.js "$RUNNER_TEMP/webui-cookie-status"

      - name: Test task configuration in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_task_config.js "$RUNNER_TEMP/webui-task-config"

      - name: Test mobile configuration in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_mobile_config.js "$RUNNER_TEMP/webui-mobile-config"

      - name: Test update and restart flow in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_update_restart.js "$RUNNER_TEMP/webui-update-restart"

      - name: Test native upgrade policy UI in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_upgrade_policy.js "$RUNNER_TEMP/webui-upgrade-policy"

      - name: Test base compatibility UI in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_base_fixes.js "$RUNNER_TEMP/webui-base-fixes"

      - name: Test plugin platform UI in Chromium
        run: node tests/run_webui_browser.js "$RUNNER_TEMP/ncmm" tests/webui_plugin_platform.js "$RUNNER_TEMP/webui-plugin-platform"

      - name: Race test high-risk services
        run: go test -race ./api/... ./config ./internal/webui ./internal/ncmm ./internal/partnerpoints ./internal/selfupdate ./internal/managedruntime ./internal/upgradepolicy ./internal/filelock ./internal/atomicfile ./pkg/cookie

      - name: Upload WebUI failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-failure-logs
          path: ${{ runner.temp }}/webui-*.log
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Verify requested source commit
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$EXPECTED_COMMIT" ]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          fi

      - name: Check Compose configuration
        run: docker compose config --quiet

      - name: Build the native image without publishing
        run: docker build --build-arg VCS_REF="$(git rev-parse HEAD)" -t ncmm-native:validation .

      - name: Verify built-in scoring command
        run: |
          docker run --rm --network none ncmm-native:validation music-partner --help
          docker run --rm --network none ncmm-native:validation task --help | grep -- '--music-partner'

      - name: Verify WebUI starts without account credentials
        run: |
          docker run -d --name ncmm-smoke --network none \
            -e NCMM_UPDATER_CHECK=false ncmm-native:validation
          trap 'docker logs ncmm-smoke; docker rm -f ncmm-smoke >/dev/null' EXIT
          for attempt in $(seq 1 50); do
            if docker exec ncmm-smoke wget -qO- http://127.0.0.1:3899/api/v1/instance >/dev/null; then
              break
            fi
            sleep 0.2
          done
          docker exec ncmm-smoke wget -qO- http://127.0.0.1:3899/api/v1/instance | grep -F "$(cat VERSION)"
          docker exec ncmm-smoke test -s /usr/share/licenses/ncmm/licenses/ncmp-MIT.txt
          docker exec ncmm-smoke test -s /data/runtime/manager.json
          docker exec ncmm-smoke test -s /data/runtime/state.json
          docker exec ncmm-smoke ncmm --version | grep -F "$(cat VERSION)"
