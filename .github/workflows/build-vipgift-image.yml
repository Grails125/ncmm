name: Build vipGift Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '原生版本号（例如：1.2.2-grails.1，auto 读取目标提交的 VERSION）'
        required: false
        type: string
        default: 'auto'
      commit_sha:
        description: '构建的 Git Commit Hash 或分支/标签（例如：2fb17f01bc，默认为 HEAD）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable helper source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Resolve source SHA and version
        id: commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SOURCE_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = auto ]; then
            VERSION=$(cat VERSION)
          fi
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-grails\.[0-9]+$ ]]
          VERSION=${VERSION#v}
          printf 'sha=%s\nversion=%s\n' "$SOURCE_SHA" "$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Validate helper release source
    needs: [resolve]
    permissions:
      contents: read
    uses: ./.github/workflows/quality-vipgift.yml
    with:
      commit_sha: ${{ needs.resolve.outputs.commit_sha }}

  docker-cloud:
    name: Build & Push Cloud Server Image
    needs: [resolve, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify validated source commit
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-vip-member-gift-cloud
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/vip_member_gift_cloud
          file: ./tools/vip_member_gift_cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
