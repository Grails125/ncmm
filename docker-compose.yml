services:
  ncmm:
    # 从当前仓库构建，保留原生评分功能；不拉取上游 3899 镜像。
    build:
      context: .
    image: ncmm-native:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:3899:3899"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      NCMM_UPDATER_AUTO_UPDATE: "false"
      # 每天 08:30 执行配置中已启用的任务；先在 WebUI 登录并设置任务开关。
      # 这条环境规则在 WebUI 中只读。改用 WebUI 管理时删除它，避免重复调度。
      CRON_1: "30 8 * * * task"
      # COOKIECLOUD_SERVER: http://host.docker.internal:8088
      # COOKIECLOUD_UUID: your-uuid
      # COOKIECLOUD_PASSWORD: your-password

# 启动：docker compose up -d --build
# 管理：http://127.0.0.1:3899
# 更新源码后重建：docker compose build --pull && docker compose up -d
# 查看日志：docker compose logs -f ncmm
# 手动单次评分：docker compose exec ncmm ncmm --home /data music-partner
